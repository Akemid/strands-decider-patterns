[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "decider-patterns"
version = "0.1.0"
description = "Reusable Strands Decider decision patterns (tool selection) plus a Capture the Flag example agent and simulator"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.13"
dependencies = [
    "strands-agents>=1.59",
    "strands-decider>=0.1.0",
    "mcp>=1.28.1,<2",
    "boto3>=1.35",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["decider_patterns"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# Long descriptive log/help lines are kept as they are.
ignore = ["E501"]
